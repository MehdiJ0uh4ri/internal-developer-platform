apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  credentials:
    source: IRSA
  # Assume this role for all managed resources unless overridden per-resource
  assumeRoleChain:
    - roleARN: arn:aws:iam::${AWS_ACCOUNT_ID}:role/CrossplaneProviderRole
