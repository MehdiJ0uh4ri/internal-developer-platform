# ResourceQuota and LimitRange for team alpha-ns.
# Crossplane patches teamName/limits from the Environment claim.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: alpha-quota
  namespace: alpha-ns
  labels:
    team: alpha
    env: dev
    managed-by: idp
spec:
  hard:
    # Compute
    requests.cpu: "4"
    limits.cpu: "8"
    requests.memory: 8Gi
    limits.memory: 16Gi
    # Storage
    requests.storage: 100Gi
    persistentvolumeclaims: "10"
    # Object counts — prevent runaway creation
    pods: "50"
    services: "20"
    secrets: "50"
    configmaps: "50"
    services.loadbalancers: "2"
    services.nodeports: "0"     # no NodePorts; use Ingress
    count/ingresses.networking.k8s.io: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: alpha-limits
  namespace: alpha-ns
  labels:
    team: alpha
    managed-by: idp
spec:
  limits:
    - type: Container
      default:             # applied when no resource spec present
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:                 # hard ceiling per container
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 10m
        memory: 32Mi
    - type: Pod
      max:
        cpu: "8"
        memory: 16Gi
    - type: PersistentVolumeClaim
      max:
        storage: 20Gi
      min:
        storage: 1Gi
