# RoleBindings for team alpha — one set per team namespace.
# Generated by Crossplane from the Environment claim.

# Platform team has cluster-wide admin
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-team:admin
  labels:
    managed-by: idp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform:admin
subjects:
  - kind: Group
    name: platform-team
    apiGroup: rbac.authorization.k8s.io
---
# Platform viewer ClusterRoleBinding (SRE on-call)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre:viewer
  labels:
    managed-by: idp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform:viewer
subjects:
  - kind: Group
    name: sre-team
    apiGroup: rbac.authorization.k8s.io
---
# Team alpha developers — scoped to their namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alpha:developers
  namespace: alpha-ns
  labels:
    team: alpha
    managed-by: idp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: team:developer
subjects:
  - kind: Group
    name: alpha-developers   # SSO group from OIDC/Dex
    apiGroup: rbac.authorization.k8s.io
---
# Team alpha viewers
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alpha:viewers
  namespace: alpha-ns
  labels:
    team: alpha
    managed-by: idp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: team:viewer
subjects:
  - kind: Group
    name: alpha-stakeholders
    apiGroup: rbac.authorization.k8s.io
---
# ArgoCD service account gets view access to sync status
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd:sync-alpha
  namespace: alpha-ns
  labels:
    team: alpha
    managed-by: idp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: team:developer
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd
