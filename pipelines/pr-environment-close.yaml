# Triggered when a PR is closed or merged.
# Deletes the GitOps folder → ArgoCD prunes the namespace automatically.
name: PR Environment — Destroy

on:
  pull_request:
    types: [closed]

jobs:
  destroy-environment:
    name: Destroy PR environment
    runs-on: ubuntu-latest
    # Only run if the PR had an ephemeral environment (check label or folder existence)
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      NAMESPACE: pr-${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          repository: your-org/idp-environments
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Check if PR environment exists
        id: check
        run: |
          if [ -d "pr-environments/pr-${{ env.PR_NUMBER }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Remove PR environment from GitOps repo
        if: steps.check.outputs.exists == 'true'
        run: |
          git config user.name "IDP Bot"
          git config user.email "idp-bot@company.com"
          git rm -rf pr-environments/pr-${{ env.PR_NUMBER }}/
          git commit -m "chore(pr-env): destroy preview for PR #${{ env.PR_NUMBER }} ($([ '${{ github.event.pull_request.merged }}' = 'true' ] && echo 'merged' || echo 'closed'))"
          git push

      # ArgoCD detects the removed Application manifest and prunes the namespace
      # (prune: true is set in the pr-environments ApplicationSet).
      # We additionally force-delete as a safety net after a short grace period.
      - name: Wait for ArgoCD to prune
        if: steps.check.outputs.exists == 'true'
        run: sleep 30

      - name: Force-delete namespace if still present
        if: steps.check.outputs.exists == 'true'
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_BASE64 }}
        run: |
          echo "${KUBECONFIG_DATA}" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          if kubectl get namespace ${{ env.NAMESPACE }} &>/dev/null; then
            echo "Namespace still exists — force-deleting"
            kubectl delete namespace ${{ env.NAMESPACE }} --timeout=120s || true
          else
            echo "Namespace already removed by ArgoCD — done"
          fi
          rm -f /tmp/kubeconfig

      - name: Comment on PR
        if: steps.check.outputs.exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const reason = '${{ github.event.pull_request.merged }}' === 'true' ? 'merged' : 'closed';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview environment \`pr-${{ env.PR_NUMBER }}\` has been destroyed (PR ${reason}).`
            });

      - name: Skip — no environment to destroy
        if: steps.check.outputs.exists == 'false'
        run: echo "No PR environment found for PR #${{ env.PR_NUMBER }} — nothing to do."
